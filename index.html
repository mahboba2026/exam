<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Book Store</title>
  </head>
  <body
    style="
      font-size: 14px;
      margin: 0px;
      padding: 10px;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <header
      class="main-header"
      style="
        background-color: rgb(0, 62, 128);
        width: 100%;
        box-sizing: border-box;
        align-items: center;
      "
    >
      <div
        class="top-logo"
        style="
          background-color: white;
          font-size: 20px;
          display: flex;
          width: 100%;
        "
      >
        <div class="logo">
          <h3 style="color: rgb(0, 34, 103)">📖<b> Book Store</b></h3>
        </div>
      </div>
      <nav class="navbar" style="display: flex">
        <a
          href="#"
          style="
            color: white;
            padding: 10px;
            align-items: center;
            text-decoration: none;
            font-size: 16px;
            justify-content: center;
            gap: 5px;
            margin: auto;
          "
        >
          Home</a
        >
        <a
          href="#"
          style="
            color: white;
            padding: 10px;
            align-items: center;
            text-decoration: none;
            font-size: 16px;
            justify-content: space-around;
            margin: auto;
          "
        >
          Books</a
        >
        <a
          href="#"
          style="
            color: white;
            padding: 10px;
            align-items: center;
            text-decoration: none;
            font-size: 16px;
            justify-content: space-around;
            margin: auto;
          "
        >
          About</a
        >
        <a
          href="#"
          style="
            color: white;
            padding: 10px;
            align-items: center;
            text-decoration: none;
            font-size: 16px;
            justify-content: space-around;
            margin: auto;
          "
        >
          Contact</a
        >
      </nav>
    </header>
    <img
      src="img/0.jpg"
      alt="library"
      style="
        max-width: 2000px;
        max-height: 990px;
        width: 100%;
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
      "
    />
    <main>
      <h2 style="margin: 10px">Our Books</h2>
      <hr style="margin: 10px" />
      <section
        style="
          max-width: 2000px;
          margin: auto;
          display: flex;
          flex-wrap: wrap;
          gap: 20px;
          justify-content: center;
          padding: 20px;
        "
      >
        <div
          style="
            flex: 1 1 220px;
            max-width: 280px;
            padding: 10px;
            margin: 30px;
            border: 1px solid;
            border-color: rgb(175, 175, 175);
            text-align: center;
          "
        >
          <img
            src="img/1.jpg"
            alt="silent patient"
            style="width: 180px; height: 200px"
          />

          <h5>Silent Patient</h5>
          <p>Yngioical Thililer</p>
          <br />
          <p style="color: crimson">$12.99</p>
        </div>

        <div
          style="
            flex: 1 1 220px;
            max-width: 280px;
            padding: 10px;
            margin: 30px;
            border: 1px solid;
            border-color: rgb(175, 175, 175);
            text-align: center;
          "
        >
          <img
            src="img/2.jpg"
            alt="Atomic Habits"
            style="width: 180px; height: 200px"
          />
          <h5>Atomic Habits</h5>
          <p>James Clear</p>
          <br />
          <p style="color: crimson">$14.99</p>
        </div>

        <div
          style="
            flex: 1 1 220px;
            max-width: 280px;
            padding: 10px;
            margin: 30px;
            border: 1px solid;
            border-color: rgb(175, 175, 175);
            text-align: center;
          "
        >
          <img
            src="img/3.jpg"
            alt="Classic Literature"
            style="width: 180px; height: 200px"
          />
          <h5>Classic Literature</h5>
          <p>Maksoni Melek</p>
          <br />
          <p style="color: crimson">$11.99</p>
        </div>

        <div
          style="
            flex: 1 1 220px;
            max-width: 280px;
            padding: 10px;
            margin: 30px;
            border: 1px solid;
            border-color: rgb(175, 175, 175);
            text-align: center;
          "
        >
          <img src="img/4.jpg" alt="1984" style="width: 180px; height: 200px" />
          <h5>1984</h5>
          <p>George Orwell</p>
          <br />
          <p style="color: crimson">$13.99</p>
        </div>
      </section>
    </main>
    <footer
      style="
        text-align: center;
        background-color: rgb(202, 202, 202);
        padding: 10px;
        width: 100%;
        box-sizing: border-box;
      "
    >
      <h7>&copy; 2026 Book Store. All rights reserved.</h7>
    </footer>
  </body>
</html>
